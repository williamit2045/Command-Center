  <script>
(function () {
  const render = () => {
    const h = (location.hash || "").toLowerCase();
    if (h.includes("projects")) {
      const root = document.getElementById("root") || document.querySelector("main") || document.body;
      if (!root) return;
      root.innerHTML = `
        <section style="min-height:80vh;display:flex;align-items:center;justify-content:center;background:#0b1220;color:#e6edf3;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
          <div style="max-width:680px;padding:24px;text-align:center">
            <h1 style="font-size:28px;margin:0 0 8px">Projects</h1>
            <p style="margin:0 0 18px;opacity:.8">Current build in focus.</p>
            <a href="https://www.intersubject.com"
               style="display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid rgba(16,185,129,.5);border-radius:10px;color:#9ae6b4;text-decoration:none">
               Visit intersubject.com ↗
            </a>
          </div>
        </section>`;
    }
  };
  window.addEventListener("hashchange", render);
  window.addEventListener("DOMContentLoaded", render);
  setTimeout(render, 200);
})();
</script>


  <script>
(function () {
  const killInterests = () => {
    const h = (location.hash || "").toLowerCase();
    if (!h.includes("about")) return;            // (safe guard)

    // Find the "Interests" heading
    const all = document.querySelectorAll("h1,h2,h3,div,span,p");
    let heading = null;
    for (const el of all) {
      const t = (el.textContent || "").trim();
      if (/^interests$/i.test(t)) { heading = el; break; }
    }
    if (!heading) return;

    // Hide the heading
    heading.style.display = "none";

    // Hide the block that follows (the cards container)
    let target = heading.parentElement.nextElementSibling;
    // walk down one level if the sibling is just a wrapper
    if (target && target.children && target.children.length === 1) {
      target = target.children[0];
    }
    if (target) target.style.display = "none";
  };

  window.addEventListener("DOMContentLoaded", killInterests);
  window.addEventListener("hashchange", killInterests);
  setTimeout(killInterests, 250);
})();
</script>
